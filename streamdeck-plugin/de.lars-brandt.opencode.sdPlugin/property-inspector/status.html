<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>OpenCode Status</title>
	<link rel="stylesheet" href="dialog.css">
</head>
<body>
	<details class="sdpi-section" id="section-display" open>
		<summary>Display</summary>
		<div class="sdpi-rows">
			<div class="sdpi-row"><label class="sdpi-label" for="status-font">Status font</label><div class="sdpi-control">
				<button type="button" class="font-trigger" id="status-font">Configure status font</button>
				<p class="sdpi-detail">Font sizes stay fixed. Text that does not fit is shortened with ….</p>
			</div></div>
		</div>
	</details>
	<dialog id="font-dialog" aria-labelledby="font-dialog-title">
		<form method="dialog" id="font-form">
			<h2 id="font-dialog-title">Status font</h2>
			<label for="font-family">Font family</label><select id="font-family"></select>
			<label for="font-size">Font size: <output id="font-size-value" for="font-size">20 px</output></label><input type="range" id="font-size" min="10" max="28" step="1" value="20">
			<label for="font-style">Font style</label><select id="font-style"></select>
			<label class="font-checkbox" for="font-underline"><input type="checkbox" id="font-underline"> Underline</label>
			<label for="font-color">Text color</label><input type="color" id="font-color">
			<div class="font-actions"><button type="button" id="font-cancel">Cancel</button><button type="submit" id="font-apply">Apply</button></div>
		</form>
	</dialog>
	<script type="module" src="status-inspector.mjs"></script>
</body>
</html>
