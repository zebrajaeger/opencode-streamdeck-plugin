<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>OpenCode Project Status</title>
	<style>body { font: 14px system-ui, sans-serif; margin: 16px; } label, input, select { display: block; width: 100%; } input, select { box-sizing: border-box; margin-top: 6px; } p { color: #666; line-height: 1.4; } details { margin-top: 18px; } details label { margin-top: 12px; }</style>
</head>
<body>
	<label for="project-select">OpenCode project</label>
	<select id="project-select" disabled>
		<option value="">No known projects yet</option>
	</select>
	<p id="project-detail">Connect OpenCode to a project to select it here. The key stays OFFLINE until its configured project connects.</p>
	<details>
		<summary>Advanced: enter a project ID</summary>
		<label for="project-id">OpenCode project ID</label>
		<input id="project-id" type="text" autocomplete="off" placeholder="Project ID">
		<p>Use this only for a project that has not yet connected to the status bridge.</p>
	</details>
	<script type="module" src="project-status-inspector.mjs"></script>
</body>
</html>
